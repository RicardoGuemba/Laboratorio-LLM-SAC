lmstudio:
  base_url: http://127.0.0.1:1234/v1
  roles:
    cliente_truepaleo:
      model: lfm2.5-1.2b-thinking-mlx
      model_family: lfm
      thinking_default: false
      max_tokens_direct: 400
      max_tokens_thinking: 600
      timeout_s_direct: 90
      timeout_s_thinking: 180
      temperature: 0.75
      top_p: 0.9
    truepaleo_sac:
      model: google/gemma-4-12b
      model_family: gemma
      thinking_default: false
      max_tokens_direct: 500
      max_tokens_thinking: 800
      timeout_s_direct: 120
      timeout_s_thinking: 300
      temperature: 0.45
      top_p: 0.85

sac:
  rag_top_k: 4
  rag_min_score: 0.1
  max_complaint_sentences: 10
  max_response_sentences: 15
  complaint_categories:
    - atraso_entrega
    - produto_defeituoso
    - reacao_alergica
    - sac_sem_resposta
    - reembolso
    - produto_vencido
    - produto_nao_enviado
    - desodorante_ineficaz

server:
  host: 127.0.0.1
  port: 8765
